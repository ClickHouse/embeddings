<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Embeddings Explorer — ClickHouse</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
    html, body { margin: 0; height: 100%; background: #000; color: #eee;
        font-family: system-ui, sans-serif; overflow: hidden; }
    #map { position: absolute; inset: 0; background: #000; cursor: crosshair; }
    /* when the report is open, shrink the map so the panel sits beside it (no overlap) */
    body.report-open #map { right: min(40%, 640px); }
    /* keep Leaflet's top controls (zoom) clear of the top header bar; JS refines to exact panel height */
    .leaflet-top { margin-top: 42px; }
    /* point-cloud hover: nearest-image thumbnail shown under the cursor after a short dwell */
    #hover { position: absolute; width: 75px; height: 75px; z-index: 1001; pointer-events: none;
        display: none; image-rendering: pixelated; border: 2px solid #ffd54f; background: #222;
        box-shadow: 0 0 12px #000; }
    /* top-K result thumbnails overlaid on the point cloud, centered on each image's (x,y) point */
    .topk-marker { background: none; border: 0; }
    .topk-marker img { box-sizing: border-box; display: block; image-rendering: pixelated;
        border: 1px solid rgba(255,213,79,.9); box-shadow: 0 0 5px #000; cursor: pointer; }
    .topk-marker img.loading { width: 0 !important; height: 0 !important; border: 0 !important; box-shadow: none !important; }
    .leaflet-container { background: #000; }
    #panel { position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
        display: flex; flex-wrap: wrap; gap: .5em; align-items: center;
        padding: .4em .6em; background: rgba(20,20,20,.88); font-size: 13px; }
    #panel b { color: #ffd54f; }
    .grp { display: flex; gap: .15em; align-items: center; }
    .grp label { color: #999; margin-right: .25em; }
    .opt { padding: .2em .5em; background: #333; border: 1px solid #000; cursor: pointer; user-select: none; }
    .opt:hover { background: #ffd54f; color: #000; }
    .opt.sel { background: #fff; color: #000; }
    #status { margin-left: auto; color: #8bc34a; font-family: monospace; }
    #report { position: absolute; top: 0; right: 0; bottom: 0; width: 40%; max-width: 640px;
        z-index: 1002; background: rgba(15,15,15,.97); overflow-y: auto; display: none;
        scrollbar-gutter: stable; box-shadow: -4px 0 20px rgba(0,0,0,.7); }
    /* sticky top-K header: title + controls + progress stay put while the grid scrolls under it */
    #rep-head { position: sticky; top: 0; z-index: 5; background: #101010;
        padding: .5em .6em .4em; box-shadow: 0 3px 10px rgba(0,0,0,.55); }
    #report h3 { margin: .2em 0 .4em; color: #ffd54f; }
    #report .close { float: right; cursor: pointer; color: #f66; font-size: 18px; }
    #grid { display: grid; grid-template-columns: repeat(auto-fill, 75px); gap: 3px; padding: .5em .6em .6em; }
    #grid img { width: 75px; height: 75px; image-rendering: pixelated; cursor: pointer;
        border: 1px solid #333; background: #222; transition: filter .15s; }
    #grid img:hover { border-color: #ffd54f; }
    /* while a new representation loads, keep the old pictures but dim them to 50% for visual diff */
    #grid.loading img { filter: brightness(.5); }
    .repctl { display: flex; flex-wrap: wrap; gap: .3em 1.2em; margin: .5em 0; align-items: center; }
    .repctl > div { display: flex; align-items: center; gap: .25em; }
    .repctl label { color: #999; font-size: 11px; }
    .repctl .opt { padding: .12em .4em; font-size: 11px; }
    .repstats { font-family: monospace; font-size: 12px; color: #8bc34a; margin: .2em 0 .5em; }
    /* live query progress bar (JSONEachRowWithProgress), play.html-style */
    #rep-progress { height: 8px; background: #222; border: 1px solid #333; border-radius: 4px;
        overflow: hidden; margin: .2em 0 .4em; display: none; }
    #rep-progress > div { height: 100%; width: 0; transition: width .15s ease-out;
        background: linear-gradient(90deg, #8bc34a, #ffd54f); }
    /* non-modal full-size preview shown on hover, pinned to the bottom-left corner */
    #full { position: absolute; left: 10px; bottom: 10px; z-index: 1003;
        display: none; pointer-events: none; }
    #full img { max-width: 42vw; max-height: 66vh; box-shadow: 0 0 40px #000;
        border: 2px solid #ffd54f; background: #000; }
    #error { position: absolute; bottom: 0; left: 0; right: 0; z-index: 1004; color: #fff;
        background: #900; padding: .5em; font-family: monospace; white-space: pre-wrap; display: none; }
    a { color: #90caf9; }
    /* About / attribution legend on the map (override Leaflet's higher-specificity white bg) */
    .leaflet-control-attribution { background: rgba(0,0,0,.78) !important; color: #eee !important;
        font-size: 12px; padding: 3px 10px; }
    .leaflet-control-attribution a { color: #ffd54f !important; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
    <b>Embeddings Explorer</b>
    <div class="grp"><label>dataset</label><span id="datasets"></span></div>
    <div class="grp"><label>mode</label><span id="modes"></span></div>
    <span id="status">ready</span>
</div>
<div id="report"><div id="report-body"></div></div>
<div id="full"><img id="full-img"></div>
<img id="hover">

<div id="error"></div>
<script>
/// ---- Config ----
const HOST = 'https://hvdvsqo23t.us-east-2.aws.clickhouse-staging.com:8443';
const USER = 'website';                 /// heavy queries: tiles, top-100 search, click lookups
const USER_THUMBS = 'website_thumbs';   /// point queries: thumbnail image loads (shares the password)
const PASS = 'Embeddings-Viewer-2026!';
const THUMBS = 'mmcommons.image_thumbs2';
const S3 = 'https://multimedia-commons.s3.us-west-2.amazonaws.com/data/images';
const TILE = 1024;                 /// tile pixel size
const COORD_BITS = 32;             /// x,y live in [0, 2^32)
/// dim = original embedding dim; rdim = rotated QBit dim (randomHadamardTransform pads 1152->2048
/// but leaves 768->768). q99 = z=0 per-pixel density for brightness (still siglip2's for clip/nomic).
const DATASETS = {
    siglip2: { table: 'mmcommons.emb_siglip2', dim: 1152, rdim: 2048, q99: 378 },
    clip:    { table: 'mmcommons.emb_clip',    dim: 768,  rdim: 768,  q99: 378 },
    nomic:   { table: 'mmcommons.emb_nomic',   dim: 768,  rdim: 768,  q99: 378 },
};
/// The 4 QBit representation columns (type x rotation). Report similarity uses ONLY these via
/// cosineDistanceTransposed(qbit, ref[dims], bits, dims). The QBit dim is dataset-aware (see qbitInfo).
const QBIT = {
    'BFloat16|original': { col: 'embedding_strided',     rot: false },
    'BFloat16|rotated':  { col: 'embedding_rotated',     rot: true  },
    'Int8|original':     { col: 'embedding_int',         rot: false },
    'Int8|rotated':      { col: 'embedding_rotated_int', rot: true  },
};
let dataset = 'siglip2';
let mode = 'points';      /// 'points' | 'thumbs'
let curReport = null;                                       /// md5 of the open report
let repSeq = 0;                                             /// guards a slow query from clobbering a newer switch
let repAbort = null;                                        /// aborts a still-running scan when switching
let repTarget = 0;      /// desired # of result images (grows 2x on scroll)
let repLoaded = 0;      /// # of result images currently shown
let repLoading = false; /// a scan is in flight (guards scroll-triggered load-more)
let repMore = true;     /// more results may exist (the last batch was full)
const MAX_RESULTS = 3000;   /// safety cap on rendered thumbnails
/// report similarity config — default: Int8, rotated, 1 bit, 128 dims (fast, coarse first pass)
let rep = { type: 'Int8', rot: 'rotated', bits: 1, dims: 128 };
const curTable = () => DATASETS[dataset].table;
/// QBit dim is dataset-aware: rotated cols use the dataset's rotated dim (rdim), others its original dim.
const qbitInfo = () => { const q = QBIT[`${rep.type}|${rep.rot}`], d = DATASETS[dataset]; return { col: q.col, dim: q.rot ? d.rdim : d.dim }; };
const repMaxBits = () => rep.type === 'Int8' ? 8 : 16;
const repMaxDims = () => qbitInfo().dim;

/// ---- ClickHouse HTTP ----
function chURL(extra, user) {
    return `${HOST}/?user=${user || USER}&password=${encodeURIComponent(PASS)}&${extra}`;
}
async function chQuery(sql, params, fmt) {
    let extra = `default_format=${fmt || 'RowBinary'}&replace_running_query=1`;
    for (const k in (params || {})) extra += `&param_${k}=${encodeURIComponent(params[k])}`;
    const resp = await fetch(chURL(extra), { method: 'POST', body: sql });
    if (!resp.ok) throw new Error(await resp.text());
    return resp;
}
/// Total row count per table (cached) — used as the progress-bar denominator, since
/// progress.total_rows_to_read is unreliable under parallel replicas.
const rowCounts = {};
async function tableRows(table) {
    if (rowCounts[table] == null)
        rowCounts[table] = +(await (await chQuery(`SELECT count() FROM ${table}`, {}, 'TSV')).text()).trim() || 0;
    return rowCounts[table];
}
function showError(t) { const e = document.getElementById('error'); e.textContent = t; e.style.display = 'block'; }
function hideError() { document.getElementById('error').style.display = 'none'; }
function setStatus(t) { document.getElementById('status').textContent = t; }
function fmtNum(n) { if (!isFinite(n)) return '—'; const u = ['', 'K', 'M', 'B', 'T']; let i = 0; while (n >= 1000 && i < 4) { n /= 1000; i++; } return (i && n < 10 ? n.toFixed(1) : Math.round(n)) + u[i]; }
function fmtBytes(n) { if (!isFinite(n)) return '—'; const u = ['B', 'KiB', 'MiB', 'GiB', 'TiB']; let i = 0; while (n >= 1024 && i < 4) { n /= 1024; i++; } return (i && n < 10 ? n.toFixed(1) : Math.round(n)) + ' ' + u[i]; }

/// ---- Point-cloud tile query ----
/// Table name comes from our own config, so it is interpolated (not a {:Identifier} param,
/// which would wrap the dotted db.table in backticks as a single identifier).
function tileSQL(table, q99) {
    /// Fixed brightness normalization: expected q99 per-pixel density / 4^zoom (each 2x zoom
    /// quarters the per-pixel area). q is a constant per tile -> brightness is consistent across
    /// tiles and zoom levels (adsb-style), instead of a per-tile quantile.
    return `WITH bitShiftLeft(1::UInt64, ${COORD_BITS} - {z:UInt8}) AS ts,
        ts * {x:UInt32} AS tx0, ts * {y:UInt32} AS ty0,
        ${q99} / pow(4, {z:UInt8}) AS q
    SELECT px, py,
        tupleElement(c,1)::UInt8 AS r, tupleElement(c,2)::UInt8 AS g, tupleElement(c,3)::UInt8 AS b
    FROM (
        SELECT px, py, colorOKLCHToSRGB((0.75 * (cnt / q), 0.16, hue * 360)) AS c
        FROM (
            SELECT toUInt16(intDiv((x - tx0) * ${TILE}, ts)) AS px,
                   toUInt16(intDiv((y - ty0) * ${TILE}, ts)) AS py,
                   count() AS cnt, avg(z) / 65535 AS hue
            FROM ${table}
            WHERE x >= tx0 AND x < tx0 + ts AND y >= ty0 AND y < ty0 + ts
            GROUP BY px, py
        )
    ) FORMAT RowBinary`;
}
/// One representative md5 per 75px cell for the thumbnails overlay.
function thumbCellsSQL(table) {
    const CELL = 75;
    return `WITH bitShiftLeft(1::UInt64, ${COORD_BITS} - {z:UInt8}) AS ts,
        ts * {x:UInt32} AS tx0, ts * {y:UInt32} AS ty0,
        intDiv(ts * ${CELL}, ${TILE}) AS cell
    SELECT (cx * ${CELL})::UInt16 AS px, (cy * ${CELL})::UInt16 AS py, argMin(md5, rnd) AS md5
    FROM (
        SELECT intDiv(x - tx0, cell) AS cx, intDiv(y - ty0, cell) AS cy, md5, cityHash64(md5) AS rnd
        FROM ${table}
        WHERE x >= tx0 AND x < tx0 + ts AND y >= ty0 AND y < ty0 + ts
    )
    GROUP BY cx, cy
    FORMAT RowBinary`;
}

/// ---- Rendering ----
async function renderTile(coords, canvas) {
    const table = curTable(), q99 = DATASETS[dataset].q99;
    const p = { z: coords.z, x: coords.x, y: coords.y };
    const ctx = canvas.getContext('2d');
    try {
        if (mode === 'thumbs' && !reportActive) { await renderThumbs(p, table, q99, ctx); return; }
        const buf = await (await chQuery(tileSQL(table, q99), p)).arrayBuffer();
        const dv = new DataView(buf);
        const img = ctx.createImageData(TILE, TILE);
        for (let o = 0; o + 7 <= buf.byteLength; o += 7) {
            const px = dv.getUint16(o, true), py = dv.getUint16(o + 2, true);
            const i = (py * TILE + px) * 4;
            img.data[i] = dv.getUint8(o + 4); img.data[i+1] = dv.getUint8(o + 5);
            img.data[i+2] = dv.getUint8(o + 6); img.data[i+3] = 255;
        }
        ctx.putImageData(img, 0, 0);
        hideError();
    } catch (e) { showError(String(e).slice(0, 500)); }
}
async function renderThumbs(p, table, q99, ctx) {
    /// faint point cloud first, then thumbnails on top
    const buf = await (await chQuery(tileSQL(table, q99), p)).arrayBuffer();
    const dv = new DataView(buf), img = ctx.createImageData(TILE, TILE);
    for (let o = 0; o + 7 <= buf.byteLength; o += 7) {
        const px = dv.getUint16(o, true), py = dv.getUint16(o + 2, true), i = (py*TILE+px)*4;
        img.data[i] = dv.getUint8(o+4)>>1; img.data[i+1] = dv.getUint8(o+5)>>1;
        img.data[i+2] = dv.getUint8(o+6)>>1; img.data[i+3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    const cells = new Uint8Array(await (await chQuery(thumbCellsSQL(table), p)).arrayBuffer());
    let o = 0;
    while (o + 4 < cells.length) {
        const px = cells[o] | (cells[o+1]<<8), py = cells[o+2] | (cells[o+3]<<8); o += 4;
        const len = cells[o++];               /// md5 <= 127 bytes -> single varint byte
        const md5 = new TextDecoder().decode(cells.subarray(o, o + len)); o += len;
        drawThumb(ctx, px, py, md5);
    }
    hideError();
}
function drawThumb(ctx, px, py, md5) {
    const im = new Image();
    im.onload = () => ctx.drawImage(im, px, py, 75, 75);
    im.src = thumbURL(md5);
}
function thumbURL(md5) {
    const sql = `WITH (SELECT thumb FROM ${THUMBS} WHERE md5 = {md5:String}) AS t
        SELECT (number % 75) AS x, intDiv(number, 75) AS y, t[number*3+1] AS r, t[number*3+2] AS g, t[number*3+3] AS b
        FROM numbers(75*75) ORDER BY y, x
        FORMAT PNG SETTINGS output_format_image_width = 75, output_format_image_height = 75`;
    return chURL(`default_format=PNG&param_md5=${encodeURIComponent(md5)}&query=${encodeURIComponent(sql)}`, USER_THUMBS);
}
function fullURL(md5) { return `${S3}/${md5.slice(0,3)}/${md5.slice(3,6)}/${md5}.jpg`; }

/// ---- Map ----
const map = L.map('map', { crs: L.CRS.Simple, minZoom: 0, maxZoom: 22,
    zoomControl: true, attributionControl: true });
/// About / attribution legend (bottom-right of the map; moves with the map when the report panel opens)
map.attributionControl.setPrefix(false).addAttribution(
    '<a href="https://github.com/ClickHouse/embeddings" target="_blank" rel="noopener">About</a> | © Alexey Milovidov, ClickHouse, Inc. (data: Multimedia Commons, CC Licenses)');
/// world = the 2^32 data plane (crs pixels [0,TILE] at zoom 0)
const worldBounds = L.latLngBounds(map.unproject([0, TILE], 0), map.unproject([TILE, 0], 0));
map.setMaxBounds(worldBounds.pad(0.3));
map.fitBounds(worldBounds);
let layer = null;
function makeLayer() {
    if (layer) map.removeLayer(layer);
    const Grid = L.GridLayer.extend({ createTile: function(coords, done) {
        const c = L.DomUtil.create('canvas', 'leaflet-tile');
        c.width = TILE; c.height = TILE;
        const n = Math.pow(2, coords.z);   /// valid tile coords: 0 <= x,y < 2^z
        if (coords.x < 0 || coords.y < 0 || coords.x >= n || coords.y >= n) {
            setTimeout(() => done(null, c), 0);   /// transparent tile, no query
            return c;
        }
        renderTile(coords, c).then(() => done(null, c)).catch(() => done(null, c));
        return c;
    }});
    layer = new Grid({ tileSize: TILE, minZoom: 0, maxZoom: 22, maxNativeZoom: 20, minNativeZoom: 0,
        bounds: worldBounds, noWrap: true });
    layer.addTo(map);
}
function redraw() { if (layer) layer.redraw(); }

/// ---- top-K overlay: result thumbnails placed on the map at their (x,y) points ----
let reportActive = false;
const topkLayer = L.layerGroup();
let overlayPts = [];                                         /// [{md5, ll, marker, size}]
const MAX_THUMB = 75, MIN_THUMB = 12;
/// inverse of latlngToData: data coords (0..2^32) -> CRS.Simple latlng
function dataToLatLng(x, y) { const s = Math.pow(2, COORD_BITS) / TILE; return map.unproject([x / s, y / s], 0); }
function overlayIcon(md5, size) {
    /// start hidden (class 'loading' -> 0x0, no border); reveal onload so loading imgs don't show a border sliver
    return L.divIcon({ className: 'topk-marker',
        html: `<img src="${thumbURL(md5)}" draggable="false" class="loading" onload="this.classList.remove('loading')" style="width:${size}px;height:${size}px">`,
        iconSize: [size, size], iconAnchor: [size / 2, size / 2] });
}
function clearOverlay() { topkLayer.clearLayers(); overlayPts = []; }
function addOverlayThumbs(rows) {   /// rows: [{md5, x, y}] -> thumbnail markers centered on each point
    for (const r of rows) {
        const ll = dataToLatLng(+r.x, +r.y);
        const marker = L.marker(ll, { icon: overlayIcon(r.md5, MAX_THUMB), keyboard: false, riseOnHover: true })
            .on('click', () => showReport(r.md5))
            .on('mouseover', () => previewImg(r.md5))
            .on('mouseout', hidePreview)
            .addTo(topkLayer);
        overlayPts.push({ md5: r.md5, ll, marker, size: MAX_THUMB });
    }
    sizeOverlay();
}
/// Size each thumbnail to its nearest-neighbor screen distance (clamped) so overlapping ones shrink.
/// Screen distances depend only on zoom, so recompute after load and on zoomend. Grid = O(n).
function sizeOverlay() {
    if (!overlayPts.length) return;
    const CELL = MAX_THUMB, grid = new Map();
    for (const p of overlayPts) p.cp = map.latLngToContainerPoint(p.ll);
    for (const p of overlayPts) {
        const k = Math.floor(p.cp.x / CELL) + ',' + Math.floor(p.cp.y / CELL);
        let a = grid.get(k); if (!a) grid.set(k, a = []); a.push(p);
    }
    for (const p of overlayPts) {
        const cx = Math.floor(p.cp.x / CELL), cy = Math.floor(p.cp.y / CELL);
        let nn = MAX_THUMB;
        for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
            const a = grid.get((cx + dx) + ',' + (cy + dy)); if (!a) continue;
            for (const o of a) { if (o === p) continue; const d = Math.hypot(p.cp.x - o.cp.x, p.cp.y - o.cp.y); if (d < nn) nn = d; }
        }
        const size = Math.max(MIN_THUMB, Math.min(MAX_THUMB, Math.round(nn / 4) * 4));   /// quantized -> fewer setIcon calls
        if (size !== p.size) { p.size = size; p.marker.setIcon(overlayIcon(p.md5, size)); }
    }
}
map.on('zoomend', sizeOverlay);

/// data coords (0..2^32) from a Leaflet CRS.Simple latlng
function latlngToData(latlng) {
    const pt = map.project(latlng, 0);   /// crs pixels at zoom 0, in [0, TILE)
    const s = Math.pow(2, COORD_BITS) / TILE;
    return { x: Math.max(0, Math.min(0xFFFFFFFF, Math.round(pt.x * s))),
             y: Math.max(0, Math.min(0xFFFFFFFF, Math.round(pt.y * s))) };
}

/// ---- Click -> nearest point -> report ----
map.on('click', async (e) => {
    /// point-cloud: if the hover thumbnail is showing, target exactly that image (what the user sees)
    if (mode === 'points' && hoverMd5) { const m = hoverMd5; hideHover(); showReport(m); return; }
    const table = curTable();
    const d = latlngToData(e.latlng);
    setStatus('finding point…');
    try {
        let sql, params;
        if (mode === 'thumbs') {
            /// Exact thumbnail clicked: reproduce the render's cell (intDiv math) in JS — all values
            /// < 2^53 so JS is exact — and argMin(md5, cityHash64(md5)) over that cell = the drawn thumb.
            const z = Math.min(Math.round(map.getZoom()), 20);   /// tile zoom (maxNativeZoom cap)
            const ts = Math.pow(2, COORD_BITS - z);
            const cell = Math.floor(ts * 75 / TILE);
            const tx0 = Math.floor(d.x / ts) * ts, ty0 = Math.floor(d.y / ts) * ts;
            const x0 = tx0 + Math.floor((d.x - tx0) / cell) * cell;
            const y0 = ty0 + Math.floor((d.y - ty0) / cell) * cell;
            const x1 = Math.min(x0 + cell, tx0 + ts), y1 = Math.min(y0 + cell, ty0 + ts);
            sql = `SELECT argMin(md5, cityHash64(md5)) FROM ${table}
                WHERE x >= {x0:UInt64} AND x < {x1:UInt64} AND y >= {y0:UInt64} AND y < {y1:UInt64} FORMAT TSV`;
            params = { x0, y0, x1, y1 };
        } else {
            /// Point cloud: nearest visible point to the click.
            const px = Math.pow(2, COORD_BITS - map.getZoom()) / TILE;   /// data units per screen pixel
            const r = Math.max(1, Math.round(px * 6));
            sql = `SELECT md5 FROM ${table}
                WHERE x BETWEEN {cx:UInt32} - {r:UInt32} AND {cx:UInt32} + {r:UInt32}
                  AND y BETWEEN {cy:UInt32} - {r:UInt32} AND {cy:UInt32} + {r:UInt32}
                ORDER BY pow(toInt64(x) - toInt64({cx:UInt32}), 2) + pow(toInt64(y) - toInt64({cy:UInt32}), 2) ASC
                LIMIT 1 FORMAT TSV`;
            params = { cx: d.x, cy: d.y, r };
        }
        const md5 = (await (await chQuery(sql, params)).text()).trim();
        if (md5) showReport(md5); else setStatus('no point near click');
    } catch (err) { showError(String(err).slice(0, 500)); }
});

/// ---- Point-cloud hover: after the mouse rests ~100ms, show the nearest image's thumbnail ----
let hoverTimer = null, hoverSeq = 0, hoverMd5 = null;
function hideHover() { if (hoverTimer) { clearTimeout(hoverTimer); hoverTimer = null; } hoverMd5 = null; document.getElementById('hover').style.display = 'none'; }
map.on('mousemove', (e) => {
    hideHover();                                             /// moving -> hide, restart the dwell timer
    if (mode !== 'points') return;
    const ll = e.latlng, cp = e.containerPoint;
    hoverTimer = setTimeout(() => hoverPreview(ll, cp), 100);
});
map.on('mouseout movestart zoomstart', hideHover);
async function hoverPreview(latlng, cp) {
    if (mode !== 'points') return;
    const seq = ++hoverSeq, d = latlngToData(latlng);
    const px = Math.pow(2, COORD_BITS - map.getZoom()) / TILE, r = Math.max(1, Math.round(px * 6));
    /// nearest point via the morton projection; routed to website_thumbs (point-query user) not to compete with reports
    const sql = `SELECT md5 FROM ${curTable()}
        WHERE x BETWEEN {cx:UInt32} - {r:UInt32} AND {cx:UInt32} + {r:UInt32}
          AND y BETWEEN {cy:UInt32} - {r:UInt32} AND {cy:UInt32} + {r:UInt32}
        ORDER BY pow(toInt64(x) - toInt64({cx:UInt32}), 2) + pow(toInt64(y) - toInt64({cy:UInt32}), 2) ASC LIMIT 1 FORMAT TSV`;
    try {
        const url = chURL(`default_format=TSV&param_cx=${d.x}&param_cy=${d.y}&param_r=${r}`, USER_THUMBS);
        const md5 = (await (await fetch(url, { method: 'POST', body: sql })).text()).trim();
        if (seq !== hoverSeq || mode !== 'points' || !md5) return;   /// mouse moved / mode switched / nothing near
        hoverMd5 = md5;                                          /// remember it so a click targets exactly the shown image
        const h = document.getElementById('hover');
        h.style.left = (cp.x + 14) + 'px'; h.style.top = (cp.y + 14) + 'px'; h.title = md5;
        h.onload = () => { if (seq === hoverSeq && mode === 'points') h.style.display = 'block'; };
        h.src = thumbURL(md5);
        if (h.complete && h.naturalWidth) h.style.display = 'block';
    } catch (e) { /* ignore transient hover errors */ }
}

/// Open (or re-target) the report. First open builds the shell; later calls keep the grid
/// so the old pictures stay (dimmed) until the new result loads.
function showReport(md5) {
    const changed = md5 !== curReport;                       /// new/re-targeted image vs same target (e.g. dataset switch)
    curReport = md5;
    rep.bits = Math.min(rep.bits, repMaxBits());   /// clamp to current type/rotation
    rep.dims = Math.min(rep.dims, repMaxDims());
    document.getElementById('report').style.display = 'block';
    layoutForReport(true);                                   /// push the map left so the panel doesn't overlap it
    if (!reportActive) {                                     /// entering report: overlay on, hide the thumbnail tiles (show point cloud)
        reportActive = true; topkLayer.addTo(map); if (mode === 'thumbs') redraw();
    }
    if (!document.getElementById('grid')) buildReportShell();
    document.getElementById('rc-query').innerHTML =
        `<a href="${fullURL(curReport)}" target=_blank>${curReport}</a> · ${dataset}`;
    buildRepScales();
    fitPanelWidth();                                         /// size the panel to a whole number of columns

    if (changed) {                                           /// target changed -> scroll to top and start from the initial top-K
        document.getElementById('report').scrollTop = 0;
        repTarget = pages15();
    }
    runSimilar(false);
    updateURL();
}
/// how many result thumbnails fill ~1.5 panel pages (the initial load size)
function pages15() {
    const grid = document.getElementById('grid'), rep = document.getElementById('report');
    const cell = 78;   /// 75px thumbnail + 3px gap
    const cols = Math.max(1, Math.floor((grid.clientWidth + 3) / cell));
    const gridTop = grid.getBoundingClientRect().top - rep.getBoundingClientRect().top;
    const rows = Math.max(2, Math.floor((rep.clientHeight - gridTop) / cell));
    return Math.min(MAX_RESULTS, Math.ceil(cols * rows * 1.5));
}
function buildReportShell() {
    document.getElementById('report-body').innerHTML =
        `<div id="rep-head">
           <span class="close" onclick="hideReport()">✕</span>
           <h3 id="rc-title">Top-100 similar</h3>
           <div>query: <span id="rc-query"></span></div>
           <div class="repctl">
             <div><label>type</label><span id="rc-type"></span></div>
             <div><label>rotation</label><span id="rc-rot"></span></div>
             <div><label>bits</label><span id="rc-bits"></span></div>
             <div><label>dims</label><span id="rc-dims"></span></div>
           </div>
           <div id="rep-progress"><div></div></div>
           <div id="rep-stats" class="repstats"></div>
         </div>
         <div id="grid"></div>`;
    buildSwitch('rc-type', ['BFloat16', 'Int8'],    rep.type, v => { rep.type = v; switchRep(); });
    buildSwitch('rc-rot',  ['original', 'rotated'], rep.rot,  v => { rep.rot  = v; switchRep(); });
}
/// bits/dims ranges depend on type & rotation, so rebuild them on every switch
function buildRepScales() {
    buildSwitch('rc-bits', Array.from({length: repMaxBits()}, (_, i) => i + 1), rep.bits, v => { rep.bits = +v; switchRep(); });
    const dims = []; for (let d = 128; d <= repMaxDims(); d += 128) dims.push(d);
    buildSwitch('rc-dims', dims, rep.dims, v => { rep.dims = +v; switchRep(); });
}
/// Switch representation on the SAME target — keeps the current pictures dimmed until the new load.
function switchRep() {
    rep.bits = Math.min(rep.bits, repMaxBits());
    rep.dims = Math.min(rep.dims, repMaxDims());
    buildRepScales();
    document.getElementById('report').scrollTop = 0;   /// any switch -> back to top with the initial top-K
    repTarget = pages15();
    runSimilar(false);
    updateURL();
}
/// Run the similarity scan. more=false rebuilds the grid to the top-`repTarget`; more=true appends
/// the next page (OFFSET repLoaded) for infinite scroll. Streams JSONEachRowWithProgress for the bar.
async function runSimilar(more) {
    const table = curTable(), col = qbitInfo().col, md5 = curReport;
    /// Int8 columns use the Quantized distance; BFloat16 use the plain transposed distance.
    const fn = rep.type === 'Int8' ? 'cosineDistanceTransposedQuantized' : 'cosineDistanceTransposed';
    const grid = document.getElementById('grid'), stats = document.getElementById('rep-stats');
    const bar = document.getElementById('rep-progress'), barFill = bar.firstElementChild;
    const off = more ? repLoaded : 0, cnt = (more ? repTarget - repLoaded : repTarget);
    if (cnt <= 0) return;
    const seq = ++repSeq;
    repLoading = true;
    if (repAbort) repAbort.abort();                          /// cancel a still-running previous scan
    const ac = repAbort = new AbortController();
    if (!more) {
        /// first open: show the query thumbnail immediately; a switch keeps the old pictures dimmed until loaded
        if (grid.children.length) grid.classList.add('loading');
        else grid.replaceChildren(thumbImg(md5, true));
    }
    bar.style.display = 'block'; barFill.style.width = '0%';
    stats.textContent = more ? 'loading more…' : `running: ${col} · ${rep.bits} bits · ${rep.dims} dims…`;
    setStatus(more ? 'loading more…' : `top: ${col} · ${rep.bits}b · ${rep.dims}d…`);
    try {
        const total = await tableRows(table);               /// bar denominator (progress.total_rows_to_read is unreliable w/ parallel replicas)
        if (seq !== repSeq) return;
        /// stable order (dist, md5) so OFFSET paging stays consistent across load-more scans
        const sql = `WITH (SELECT arraySlice(CAST(${col}, 'Array(Float32)'), 1, {dims:UInt32}) FROM ${table} WHERE md5 = {md5:String} LIMIT 1) AS q
            SELECT md5, x, y FROM ${table}
            WHERE md5 != {md5:String}
            ORDER BY ${fn}(${col}, q, {bits:UInt8}, {dims:UInt32}) ASC, md5 ASC
            LIMIT {off:UInt32}, {cnt:UInt32} FORMAT JSONEachRowWithProgress`;
        /// BFloat16 cosineDistanceTransposed + scalar arg + parallel replicas hits a CH bug -> disable PR for it; Int8 ok
        const noPR = rep.type === 'BFloat16' ? '&enable_parallel_replicas=0' : '';
        const url = chURL(`replace_running_query=1${noPR}` +
            `&param_md5=${encodeURIComponent(md5)}&param_bits=${rep.bits}&param_dims=${rep.dims}&param_off=${off}&param_cnt=${cnt}`);
        const resp = await fetch(url, { method: 'POST', body: sql, signal: ac.signal });
        if (!resp.ok) throw new Error(await resp.text());
        const reader = resp.body.getReader(), decoder = new TextDecoder();
        let buf = '', rows = [], prog = null;
        for (;;) {
            const { done, value } = await reader.read();
            if (done) break;
            buf += decoder.decode(value, { stream: true });
            let nl;
            while ((nl = buf.indexOf('\n')) >= 0) {          /// JSONEachRowWithProgress = newline-delimited {progress|row|meta|exception}
                const line = buf.slice(0, nl); buf = buf.slice(nl + 1);
                if (!line) continue;
                const o = JSON.parse(line);
                if (o.progress) {
                    prog = o.progress;
                    const rr = +prog.read_rows || 0, rb = +prog.read_bytes || 0, secs = (+prog.elapsed_ns || 0) / 1e9;
                    barFill.style.width = (total ? Math.min(rr / total, 1) * 100 : 0).toFixed(1) + '%';
                    stats.textContent = `${more ? 'loading more' : 'scanning'}: ${fmtNum(rr)} / ${fmtNum(total)} rows · ${fmtBytes(secs ? rb / secs : 0)}/s`;
                } else if (o.row) {
                    rows.push(o.row);                        /// {md5, x, y}
                } else if (o.exception) {
                    throw new Error(o.exception);
                }
            }
        }
        if (seq !== repSeq) return;                          /// a newer switch superseded this run (it owns repLoading)
        bar.style.display = 'none';
        if (more) {
            for (const r of rows) grid.appendChild(thumbImg(r.md5, false));   /// append the next page (keeps scroll position)
            addOverlayThumbs(rows);                                           /// and place them on the map
            repLoaded += rows.length;
        } else {
            const next = [thumbImg(md5, true)];                            /// rebuild: query thumb + results
            for (const r of rows) next.push(thumbImg(r.md5, false));
            grid.replaceChildren(...next);
            grid.classList.remove('loading');
            clearOverlay(); addOverlayThumbs(rows);                        /// refresh the on-map overlay
            repLoaded = rows.length;
        }
        repMore = rows.length === cnt && repLoaded < MAX_RESULTS;          /// full batch -> more may exist
        hideError();
        document.getElementById('rc-title').textContent = `Top-${repLoaded} similar`;
        const secs = (+(prog && prog.elapsed_ns) || 0) / 1e9, rr = +(prog && prog.read_rows) || 0, rb = +(prog && prog.read_bytes) || 0;
        stats.innerHTML = `${repLoaded} shown · <b>${secs.toFixed(2)} s</b> · ${fmtNum(secs ? rr / secs : 0)} rows/s · ` +
            `${fmtBytes(secs ? rb / secs : 0)}/s · scanned ${fmtNum(rr)} rows`;
        setStatus(`report: ${repLoaded} · ${secs.toFixed(2)}s`);
        repLoading = false;
    } catch (err) {
        if (seq !== repSeq) return;                          /// superseded/aborted -> a newer run owns repLoading
        bar.style.display = 'none';
        grid.classList.remove('loading');                   /// restore brightness of the kept pictures
        repLoading = false;
        const msg = String(err);
        if (/INCORRECT_RESULT_OF_SCALAR_SUBQUERY|empty result/i.test(msg)) {
            hideError();                                     /// target md5 not embedded in this dataset (datasets differ)
            stats.textContent = `this image is not in "${dataset}"`;
        } else {
            showError(msg.slice(0, 500));
            stats.textContent = 'error';
        }
    }
}
/// infinite scroll: near the bottom of the panel, request 2x more results
document.getElementById('report').addEventListener('scroll', function () {
    if (repLoading || !repMore || !curReport) return;
    if (this.scrollTop + this.clientHeight < this.scrollHeight - 300) return;
    repTarget = Math.min(repLoaded * 2, MAX_RESULTS);
    if (repTarget > repLoaded) runSimilar(true);
});
/// One grid thumbnail: hover shows the full-size preview; clicking a result re-targets the search.
function thumbImg(md5, isQuery) {
    const img = document.createElement('img');
    img.src = thumbURL(md5);
    img.title = isQuery ? 'query · hover to preview' : md5 + ' · click to search from here';
    if (isQuery) img.style.borderColor = '#ffd54f';
    else img.onclick = () => showReport(md5);
    img.onmouseenter = () => previewImg(md5);
    img.onmouseleave = hidePreview;
    return img;
}
function previewImg(md5) {
    document.getElementById('full-img').src = fullURL(md5);
    document.getElementById('full').style.display = 'block';
}
function hidePreview() { document.getElementById('full').style.display = 'none'; }
function hideReport() {
    document.getElementById('report').style.display = 'none'; hidePreview(); layoutForReport(false);
    reportActive = false; clearOverlay(); if (map.hasLayer(topkLayer)) map.removeLayer(topkLayer);
    if (mode === 'thumbs') redraw();                         /// restore the thumbnail tiles
    updateURL();
}
/// Toggle the map-shrink layout and tell Leaflet to re-measure its container.
function layoutForReport(open) {
    document.body.classList.toggle('report-open', open);
    if (!open) { const r = document.getElementById('report'); r.style.width = ''; r.style.maxWidth = ''; document.getElementById('map').style.right = ''; }
    map.invalidateSize();
}
/// Size the panel to a whole number of thumbnail columns (no leftover gutter on the right),
/// and match the map's right edge to it. Measure-and-trim: reset to the CSS max, measure the
/// actual leftover after auto-fill, then trim exactly that (handles scrollbar + sub-pixel rounding).
function fitPanelWidth() {
    const report = document.getElementById('report'), grid = document.getElementById('grid');
    if (!grid) return;
    report.style.width = ''; report.style.maxWidth = '';   /// back to CSS (40% / 640px) to measure
    const CELL = 75, GAP = 3, cs = getComputedStyle(grid);
    const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    const content = grid.clientWidth - padX;               /// actual grid content width at the max
    const cols = Math.max(1, Math.floor((content + GAP) / (CELL + GAP)));
    const leftover = content - (cols * CELL + (cols - 1) * GAP);
    const w = report.offsetWidth - Math.floor(leftover);   /// floor keeps all cols (leaves <1px, never drops one)
    report.style.maxWidth = 'none'; report.style.width = w + 'px';
    if (reportActive) { document.getElementById('map').style.right = w + 'px'; map.invalidateSize(); }
}

/// ---- Switchers ----
function buildSwitch(elemId, keys, current, onPick) {
    const el = document.getElementById(elemId); el.innerHTML = '';
    keys.forEach(k => {
        const s = document.createElement('span'); s.className = 'opt' + (k === current ? ' sel' : '');
        s.textContent = k;
        s.onclick = () => { [...el.children].forEach(c => c.classList.remove('sel')); s.classList.add('sel'); onPick(k); };
        el.appendChild(s);
    });
}
/// ---- init: restore state from the URL hash, build the UI, then keep the URL in sync ----
const urlp = new URLSearchParams(location.hash.slice(1));
if (DATASETS[urlp.get('ds')]) dataset = urlp.get('ds');
if (urlp.get('mode') === 'points' || urlp.get('mode') === 'thumbs') mode = urlp.get('mode');
if (urlp.get('type')) rep.type = urlp.get('type');
if (urlp.get('rot')) rep.rot = urlp.get('rot');
if (+urlp.get('bits')) rep.bits = +urlp.get('bits');
if (+urlp.get('dims')) rep.dims = +urlp.get('dims');

buildSwitch('datasets', Object.keys(DATASETS), dataset, k => {
    dataset = k;
    rep.dims = Math.min(rep.dims, repMaxDims());   /// keep the selected #dims if the new embedding supports it, else clamp to its max
    makeLayer();
    /// if a report is open, rerun the top-100 for the SAME target in the newly selected dataset
    if (curReport && document.getElementById('report').style.display !== 'none') showReport(curReport);
    updateURL();
});
buildSwitch('modes', ['points', 'thumbs'], mode, k => {
    mode = k;
    if (k === 'thumbs' && reportActive) hideReport();   /// thumbs mode has no top-K panel — close it on switch
    hideHover(); redraw(); updateURL();
});

/// offset the Leaflet top controls below the (variable-height, wrappable) header bar
function offsetControls() {
    const h = document.getElementById('panel').offsetHeight + 6;
    document.querySelectorAll('.leaflet-control-container .leaflet-top').forEach(el => el.style.marginTop = h + 'px');
}
offsetControls();
addEventListener('resize', () => { offsetControls(); if (reportActive) fitPanelWidth(); });

makeLayer();

/// restore the map view + reopen the report (after the layer exists)
if (urlp.get('md5')) showReport(urlp.get('md5'));
if (urlp.has('z') && urlp.has('x') && urlp.has('y'))
    map.setView(dataToLatLng(+urlp.get('x'), +urlp.get('y')), +urlp.get('z'));

/// serialize state -> URL hash (bookmarkable/shareable); replaceState so it doesn't spam history
function updateURL() {
    const c = latlngToData(map.getCenter());
    const p = new URLSearchParams();
    p.set('ds', dataset); p.set('mode', mode);
    p.set('z', Math.round(map.getZoom())); p.set('x', c.x); p.set('y', c.y);
    if (reportActive && curReport) {
        p.set('md5', curReport); p.set('type', rep.type); p.set('rot', rep.rot);
        p.set('bits', rep.bits); p.set('dims', rep.dims);
    }
    history.replaceState(null, '', '#' + p.toString());
}
map.on('moveend zoomend', updateURL);
updateURL();
</script>
</body>
